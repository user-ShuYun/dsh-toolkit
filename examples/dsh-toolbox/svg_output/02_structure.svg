<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" width="1280" height="720" font-family="Microsoft YaHei, Segoe UI" font-size="24" fill="#EAF6FA" lang="zh-CN">
